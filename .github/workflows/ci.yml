name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Só gera os tipos a partir do schema — não precisa de banco de
      # verdade nem de DATABASE_URL, `prisma generate` nunca conecta.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
